[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
extra_scripts =
    pre:tools/platformio_pre.py
    post:tools/platformio_post.py
lib_deps =
    witnessmenow/UniversalTelegramBot @ ^1.3.0
    bblanchon/ArduinoJson @ ^6.21.5

; Use this environment for Wi-Fi OTA uploads.
[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota

; Explicit USB alias. PlatformIO auto-detects or uses the port selected in UI.
[env:esp32dev-usb]
extends = env:esp32dev
