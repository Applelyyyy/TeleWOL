[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    witnessmenow/UniversalTelegramBot @ ^1.3.0
    bblanchon/ArduinoJson @ ^6.21.5

; Use this environment after the first USB upload. Set ESP32_OTA_HOST and
; ESP32_OTA_PASSWORD in your shell before uploading; do not put them here.
[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = ${sysenv.ESP32_OTA_HOST}
upload_flags =
    --auth=${sysenv.ESP32_OTA_PASSWORD}
